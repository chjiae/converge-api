server:
  port: 8080

spring:
  application:
    name: converge-api
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://localhost:5432/converge_api
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 3
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret-key: ConvergeApiSecretKey2026ThisIsAVeryLongSecretKeyForHS256Algorithm
  access-token-expiration: 7200000    # 访问令牌有效期 2 小时（毫秒）
  refresh-token-expiration: 604800000 # 刷新令牌有效期 7 天（毫秒）

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

logging:
  level:
    com.github.chjiae: DEBUG
    org.springframework.web: INFO

# 支付网关配置（密钥使用环境变量占位符，禁止硬编码）
payment:
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8080/api/v1/payment/alipay/notify}
    gateway: ${ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    mch-id: ${WECHAT_MCH_ID:}
    mch-serial-no: ${WECHAT_MCH_SERIAL_NO:}
    api-v3-key: ${WECHAT_API_V3_KEY:}
    private-key-path: ${WECHAT_PRIVATE_KEY_PATH:}
    notify-url: ${WECHAT_NOTIFY_URL:http://localhost:8080/api/v1/payment/wechat/notify}

# 认证 Cookie 配置
auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
    domain: ${AUTH_COOKIE_DOMAIN:}

# 应用邮件配置
app:
  mail:
    from-name: ${MAIL_FROM_NAME:Converge API}

# AI 凭据加密配置（密钥必须由环境变量提供，禁止硬编码到 Git 仓库）
ai:
  credential:
    encryption:
      active-key-id: ${AI_CREDENTIAL_ACTIVE_KEY_ID:}
      active-key-base64: ${AI_CREDENTIAL_ACTIVE_KEY_BASE64:}
      fingerprint-key-base64: ${AI_CREDENTIAL_FINGERPRINT_KEY_BASE64:}
  gateway:
    admin:
      enabled: ${AI_GATEWAY_ADMIN_ENABLED:false}
      base-url: ${AI_GATEWAY_ADMIN_BASE_URL:}
      connect-timeout-ms: ${AI_GATEWAY_ADMIN_CONNECT_TIMEOUT_MS:1000}
      read-timeout-ms: ${AI_GATEWAY_ADMIN_READ_TIMEOUT_MS:3000}
    snapshot:
      key-id: ${AI_GATEWAY_SNAPSHOT_KEY_ID:}
      encryption-key-base64: ${AI_GATEWAY_SNAPSHOT_ENCRYPTION_KEY_BASE64:}
      signing-key-base64: ${AI_GATEWAY_SNAPSHOT_SIGNING_KEY_BASE64:}
      outbox-batch-size: ${AI_GATEWAY_SNAPSHOT_OUTBOX_BATCH_SIZE:50}
      outbox-lock-timeout-ms: ${AI_GATEWAY_SNAPSHOT_OUTBOX_LOCK_TIMEOUT_MS:30000}
      outbox-projector-interval-ms: ${AI_GATEWAY_SNAPSHOT_OUTBOX_PROJECTOR_INTERVAL_MS:5000}
      reproject-interval-ms: ${AI_GATEWAY_SNAPSHOT_REPROJECT_INTERVAL_MS:60000}
      reproject-initial-delay-ms: ${AI_GATEWAY_SNAPSHOT_REPROJECT_INITIAL_DELAY_MS:10000}
      history-retain-count: ${AI_GATEWAY_SNAPSHOT_HISTORY_RETAIN_COUNT:3}
