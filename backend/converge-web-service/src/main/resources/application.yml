server:
  port: 8080

spring:
  application:
    name: converge-api
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://localhost:5432/converge_api
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 3
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret-key: ConvergeApiSecretKey2026ThisIsAVeryLongSecretKeyForHS256Algorithm
  access-token-expiration: 7200000    # 访问令牌有效期 2 小时（毫秒）
  refresh-token-expiration: 604800000 # 刷新令牌有效期 7 天（毫秒）

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

logging:
  level:
    com.github.chjiae: DEBUG
    org.springframework.web: INFO
